name: Janus Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: PWA syntax
        run: |
          node --check apps/pwa/app.js
          node --check apps/pwa/pcm-capture-worklet.js
          node --check apps/pwa/pcm-tts-player.js
          node --check apps/pwa/sw.js
          node --check scripts/start-local-voice.mjs
      - name: Sidecar syntax
        run: python3 -m py_compile sidecars/qwen3_tts_server.py
      - name: Tests
        run: npm test
      - name: Runtime smoke
        run: node tests/runtime-smoke.mjs
