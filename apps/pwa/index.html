<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>JANUS</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">JANUS CORE</div>
        <h1>Trabajo en vivo</h1>
      </div>
      <div id="connection" class="connection offline"><span></span> desconectado</div>
    </header>

    <section class="presence" aria-live="polite">
      <button id="voiceButton" class="orb" aria-label="Hablar con Janus">
        <span class="orb-core"></span>
        <span class="orb-ring ring-a"></span>
        <span class="orb-ring ring-b"></span>
      </button>
      <div>
        <div id="presenceState" class="presence-state">Listo</div>
        <div id="transcript" class="transcript">Toca el núcleo y habla. Janus seguirá mostrando el trabajo mientras ejecuta.</div>
      </div>
    </section>

    <section class="command-card">
      <textarea id="command" rows="2" placeholder="Dile a Janus qué quieres conseguir…"></textarea>
      <div class="command-actions">
        <button id="sendButton" class="primary">Ejecutar</button>
        <button id="pauseButton" class="secondary" disabled>Pausar</button>
        <button id="stopButton" class="secondary" disabled>Detener</button>
      </div>
    </section>

    <section class="work">
      <div class="section-head">
        <div>
          <div class="eyebrow">EJECUCIÓN OBSERVABLE</div>
          <h2>Lo que Janus está haciendo</h2>
        </div>
        <button id="clearButton" class="ghost">Limpiar vista</button>
      </div>
      <div id="activity" class="activity empty">
        <div class="empty-state">Todavía no hay una ejecución activa.</div>
      </div>
    </section>
  </div>

  <template id="eventTemplate">
    <article class="event-card">
      <div class="event-marker"></div>
      <div class="event-body">
        <div class="event-meta"><span class="event-source"></span><span class="event-time"></span></div>
        <div class="event-summary"></div>
        <div class="event-detail"></div>
      </div>
    </article>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
